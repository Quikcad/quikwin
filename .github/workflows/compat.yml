name: vulkan-go compat

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build (latest vulkan-go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: update vulkan-go to latest
        run: |
          CGO_ENABLED=0 go get github.com/lukem570/vulkan-go
          CGO_ENABLED=0 go mod tidy

      - name: build
        run: CGO_ENABLED=0 go build ./...

      - name: vet
        run: CGO_ENABLED=0 go vet ./...

      - name: test
        run: CGO_ENABLED=0 go test ./...

      # linux/arm64 has no poll syscall, so a host build alone did not catch
      # the backends drifting off it. Every desktop target gets built.
      - name: crossbuild
        run: |
          fail=0
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            if GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./...; then
              echo "  ok   $target"
            else
              echo "  FAIL $target"
              fail=1
            fi
          done
          exit $fail
